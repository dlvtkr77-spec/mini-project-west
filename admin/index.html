<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>자격증 접수 관리자</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <!-- =========================
       사이드바
  ========================== -->

  <aside class="sidebar">

    <div class="sidebar-logo">
      <span class="logo-mark">M</span>

      <div>
        <strong>자격증 간편접수</strong>
        <p>관리자</p>
      </div>
    </div>

    <nav class="sidebar-nav">

      <button
        class="nav-item active"
        type="button"
      >
        접수 관리
      </button>

    </nav>

    <div class="sidebar-bottom">
      <a href="../">
        사용자 페이지로 이동
      </a>
    </div>

  </aside>


  <!-- =========================
       메인
  ========================== -->

  <main class="admin-main">

    <header class="admin-header">

      <div>
        <p class="eyebrow">
          APPLICATION MANAGEMENT
        </p>

        <h1>접수 관리</h1>

        <p class="header-description">
          자격증 시험 접수 현황을 확인합니다.
        </p>
      </div>

      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >
        새로고침
      </button>

    </header>


    <!-- =========================
         요약 카드
    ========================== -->

    <section class="summary-grid">

      <article class="summary-card">
        <span>전체 접수</span>

        <strong id="total-count">
          -
        </strong>

        <p>전체 신청 건수</p>
      </article>


      <article class="summary-card">
        <span>접수 완료</span>

        <strong id="complete-count">
          -
        </strong>

        <p>정상 접수 건수</p>
      </article>


      <article class="summary-card">
        <span>결제 대기</span>

        <strong id="payment-wait-count">
          -
        </strong>

        <p>결제 처리 대기</p>
      </article>


      <article class="summary-card">
        <span>오늘 접수</span>

        <strong id="today-count">
          -
        </strong>

        <p>오늘 등록된 접수</p>
      </article>

    </section>


    <!-- =========================
         접수 목록
    ========================== -->

    <section class="application-panel">

      <div class="panel-heading">

        <div>
          <h2>접수 목록</h2>

          <p>
            Supabase에 저장된 접수 데이터를 조회합니다.
          </p>
        </div>

      </div>


      <!-- 검색 / 필터 -->

      <div class="filter-bar">

        <div class="search-box">

          <input
            type="search"
            id="admin-search"
            placeholder="이름, 연락처, 자격증 검색"
          >

        </div>


        <select id="certificate-filter">

          <option value="">
            전체 자격증
          </option>

          <option value="한식조리기능사">
            한식조리기능사
          </option>

          <option value="지게차운전기능사">
            지게차운전기능사
          </option>

          <option value="굴착기운전기능사">
            굴착기운전기능사
          </option>

          <option value="전기기능사">
            전기기능사
          </option>

          <option value="손해평가사">
            손해평가사
          </option>

          <option value="공인중개사">
            공인중개사
          </option>

          <option value="요양보호사">
            요양보호사
          </option>

          <option value="위생사">
            위생사
          </option>

        </select>


        <select id="status-filter">

          <option value="">
            전체 상태
          </option>

          <option value="접수완료">
            접수완료
          </option>

          <option value="접수취소">
            접수취소
          </option>

        </select>

      </div>


      <!-- 테이블 -->

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>접수번호</th>
              <th>신청자</th>
              <th>자격증</th>
              <th>시험지역</th>
              <th>시험일</th>
              <th>결제금액</th>
              <th>결제상태</th>
              <th>접수상태</th>
              <th>접수일</th>
            </tr>

          </thead>


          <tbody id="application-table-body">

            <tr>
              <td
                colspan="9"
                class="loading-cell"
              >
                접수 데이터를 불러오는 중입니다.
              </td>
            </tr>

          </tbody>

        </table>

      </div>


      <!-- 결과 없음 -->

      <div
        id="empty-state"
        class="empty-state"
        hidden
      >
        <strong>
          접수 내역이 없습니다.
        </strong>

        <p>
          조건에 맞는 접수 데이터를 찾을 수 없습니다.
        </p>
      </div>

    </section>

  </main>


  <script src="./script.js"></script>

</body>
</html>
