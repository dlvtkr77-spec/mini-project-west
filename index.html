<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>시니어 자격증 간편접수</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>시니어 자격증 간편접수</h1>
    <p>신청하실 자격증을 선택하고 정보를 입력해주세요.</p>
  </header>

  <main>

    <!-- 자격증 선택 -->
    <section class="certificate-section">
      <h2>1. 신청할 자격증을 선택해주세요</h2>

      <div class="certificate-list">

        <button
          type="button"
          class="certificate-card"
          data-certificate="한식조리기능사">
          한식조리기능사
        </button>

        <button
          type="button"
          class="certificate-card"
          data-certificate="전기기능사">
          전기기능사
        </button>

        <button
          type="button"
          class="certificate-card"
          data-certificate="공인중개사">
          공인중개사
        </button>

      </div>
    </section>


    <!-- 신청자 정보 -->
    <section class="application-section">
      <h2>2. 신청자 정보를 입력해주세요</h2>

      <form id="application-form">

        <div class="form-group">
          <label for="name">이름</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="이름을 입력해주세요"
            required>
        </div>

        <div class="form-group">
          <label for="phone">연락처</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="010-0000-0000"
            required>
        </div>

        <input
          type="hidden"
          id="selected-certificate"
          name="certificate">

        <button type="submit" class="submit-button">
          접수 신청하기
        </button>

      </form>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
